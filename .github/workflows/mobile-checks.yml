name: Mobile Checks

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-checks.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-checks.yml'

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test